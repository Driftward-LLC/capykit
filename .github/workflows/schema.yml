name: Schema

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate schema contract
        run: node scripts/test-schema.mjs

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.2 README.md "docs/**/*.md"
