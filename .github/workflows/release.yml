name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  packages: write

env:
  CAPYKIT_IMAGE: ghcr.io/driftward-llc/capykit

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org", cache: npm }
      - run: npm ci
      - run: npm run check
      - name: Verify tag matches package version
        id: release
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "$GITHUB_REF_NAME"
          short_sha="$(git rev-parse --short=12 HEAD)"
          containerfile="${RUNNER_TEMP}/capykit.Containerfile"
          node scripts/container-image.mjs print-containerfile > "${containerfile}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "containerfile=${containerfile}" >> "${GITHUB_OUTPUT}"
      - name: Publish npm package with provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.release.outputs.containerfile }}
          platforms: linux/amd64,linux/arm64
          pull: false
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.CAPYKIT_IMAGE }}:${{ steps.release.outputs.version }}
            ${{ env.CAPYKIT_IMAGE }}:sha-${{ steps.release.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=Capykit MCP server
            org.opencontainers.image.description=Read-only Capykit MCP server
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
      - name: Create source release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
